  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;

    }

    .container {
      background: white;
      padding: 40px;

      margin: 15px 0;

      font-size: 20px;
      border-radius: 12px;
      color: white;
      background: #0055aa;
      transition: 0.2s;
    }

    a:hover {
      background: #003f80;
    }
