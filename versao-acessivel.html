<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acessível para Idosos</title>

    <style>
        :root {
            --font-size: 20px;
            --primary: #003366;
            --secondary: #ffffff;
            --background: #f4f4f4;
            --border: #cfcfcf;
            --success: #1f7a1f;
            --error: #9b1c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: var(--font-size);
            background: var(--background);
            color: #111;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        .font-controls button {
            padding: 12px 16px;
            font-size: 18px;
            margin-left: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            padding: 20px;
            min-height: calc(100vh - 100px);
        }

        .panel {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--border);
        }

        .product-item {
            border: 2px solid #999;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            background: #fafafa;
            transition: 0.2s;
        }

        .product-item:hover,
        .product-item:focus {
            background: #dcecff;
            outline: 4px solid #66a3ff;
        }

        .image-area {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;

            position: relative;
        }

        .product-image-container {
            position: relative;
            width: 320px;
            height: 320px;
            overflow: hidden;
            border-radius: 12px;
            border: 3px solid #ccc;
            cursor: crosshair;
            background: white;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .zoom-view {
            width: 320px;
            height: 320px;
            border: 3px solid #003366;
            border-radius: 12px;
            background-repeat: no-repeat;
            background-color: white;

            position: absolute;
            left: 360px;
            top: 0;

            z-index: 9999;

            display: none;

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .details {
            line-height: 1.6;
        }

        .add-button {
            margin-top: 20px;
            width: 100%;
            padding: 18px;
            font-size: 22px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .add-button:hover,
        .add-button:focus {
            background: #004c99;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid #ccc;
            gap: 10px;
        }

        .remove-btn {
            background: #b30000;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 20px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 18px 24px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }

        .success {
            background: var(--success);
        }

        .error {
            background: var(--error);
        }

        @media (max-width: 1000px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        #product-list {
            display: flex;
            column-gap: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>Sistema de Compras Acessível</h1>
            <p>Interface simples e confortável para pessoas idosas.</p>
        </div>

        <div class="font-controls" aria-label="Controle de tamanho da fonte">
            <button onclick="changeFontSize(2)" aria-label="Aumentar fonte">A+</button>
            <button onclick="changeFontSize(-2)" aria-label="Diminuir fonte">A-</button>
        </div>
    </header>

    <div class="container">

        <section class="panel" aria-labelledby="titulo-produtos">
            <h2 id="titulo-produtos">Lista de Produtos</h2>

            <div id="product-list"></div>
        </section>

        <main class="panel" aria-live="polite">
            <h2>Detalhes do Produto</h2>

            <div id="product-details">
                <p>Selecione um produto para visualizar os detalhes.</p>
            </div>
        </main>

        <aside class="panel" aria-labelledby="titulo-carrinho">
            <h2 id="titulo-carrinho">Carrinho</h2>

            <div id="cart"></div>
        </aside>

    </div>

    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <script src="./database.js"></script>
    <script>
        let selectedProduct = null;
        let fontSize = 20;

        const cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            products.forEach(product => {
                const item = document.createElement('button');
                item.className = 'product-item';
                item.setAttribute('aria-label', `${product.name}, ${product.qty} itens disponíveis`);

                item.innerHTML = `
        <strong>${product.name}</strong><br>
        Itens disponíveis: ${product.qty}
      `;

                item.onclick = () => selectProduct(product.id);

                list.appendChild(item);
            });
        }

        function selectProduct(id) {
            selectedProduct = products.find(p => p.id === id);

            const details = document.getElementById('product-details');

            details.innerHTML = `
      <h3>${selectedProduct.name}</h3>

      <div class="image-area">

        <div
            class="product-image-container"
            onmousemove="zoomImage(event)"
            onmouseleave="hideZoom()"
            aria-label="Passe o mouse sobre a imagem para ampliar detalhes"
        >
            <img
            id="product-image"
            class="product-image"
            src="${selectedProduct.img}"
            alt="Imagem ampliável do produto ${selectedProduct.name}"
            >
        </div>

        <div
            id="zoom-view"
            class="zoom-view"
            aria-hidden="true"
        ></div>

      </div>

      <div class="details">
        <p>${selectedProduct.desc}</p>

        <p><strong>Itens disponíveis:</strong> ${selectedProduct.qty}</p>
      </div>

      <button
        class="add-button"
        onclick="addToCart()"
        aria-label="Adicionar ${selectedProduct.name} ao carrinho"
      >
        Adicionar ao carrinho
      </button>
    `;
        }

        function addToCart() {
            if (!selectedProduct) {
                showToast('Selecione um produto primeiro.', 'error');
                return;
            }

            if (selectedProduct.qty <= 0) {
                showToast('Produto sem estoque disponível.', 'error');
                return;
            }

            selectedProduct.qty--;

            const existingItem = cart.find(item => item.id === selectedProduct.id);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    id: selectedProduct.id,
                    name: selectedProduct.name,
                    quantity: 1
                });
            }

            showToast('Produto adicionado ao carrinho.', 'success');

            renderProducts();
            renderCart();
            selectProduct(selectedProduct.id);
        }

        function renderCart() {
            const cartElement = document.getElementById('cart');

            if (cart.length === 0) {
                cartElement.innerHTML = '<p>Nenhum item no carrinho.</p>';
                return;
            }

            cartElement.innerHTML = '';

            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'cart-item';

                div.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          Quantidade: ${item.quantity}
        </div>

        <button
          class="remove-btn"
          onclick="removeFromCart(${item.id})"
          aria-label="Remover ${item.name} do carrinho"
        >
          🗑
        </button>
      `;

                cartElement.appendChild(div);
            });
        }

        function removeFromCart(id) {
            const cartItem = cart.find(item => item.id === id);

            if (!cartItem) return;

            const product = products.find(product => product.id === id);

            product.qty++;
            cartItem.quantity--;

            if (cartItem.quantity <= 0) {
                const index = cart.indexOf(cartItem);
                cart.splice(index, 1);
            }

            showToast('Produto removido do carrinho.', 'success');

            renderProducts();
            renderCart();

            if (selectedProduct && selectedProduct.id === id) {
                selectProduct(id);
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');

            toast.textContent = message;
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function changeFontSize(value) {
            fontSize += value;

            if (fontSize < 16) fontSize = 16;
            if (fontSize > 34) fontSize = 34;

            document.documentElement.style.setProperty('--font-size', fontSize + 'px');
        }

        function zoomImage(event) {
            const image = document.getElementById('product-image');
            const zoomView = document.getElementById('zoom-view');

            zoomView.style.display = 'block';

            const rect = image.getBoundingClientRect();

            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;

            zoomView.style.backgroundImage = `url(${image.src})`;
            zoomView.style.backgroundSize = '200%';
            zoomView.style.backgroundPosition = `${xPercent}% ${yPercent}%`;
        }

        function hideZoom() {
            document.getElementById('zoom-view').style.display = 'none';
        }

        renderProducts();
        renderCart();
    </script>

</body>

</html>
